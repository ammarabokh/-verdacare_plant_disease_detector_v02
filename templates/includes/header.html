<header class="bg-white dark:bg-dark-card shadow-md sticky top-0 z-50 transition-colors duration-300">
    <div class="container mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
            <!-- Logo -->
            <a href="{{ url_for('index') }}" class="flex items-center gap-3">
                <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center">
                    <i class="fas fa-leaf text-white text-xl"></i>
                </div>
                <span class="text-xl font-bold text-gray-800 dark:text-white">
                    {{ _('Plant Doctor') }}
                </span>
            </a>

            <!-- Navigation -->
            <nav class="hidden md:flex items-center gap-6">
                <a href="{{ url_for('index') }}" class="text-gray-600 dark:text-gray-300 hover:text-primary transition">
                    {{ _('Home') }}
                </a>
                <a href="#" onclick="toggleChat()" class="text-gray-600 dark:text-gray-300 hover:text-primary transition">
                    {{ _('Chat') }}
                </a>
            </nav>

            <!-- Controls -->
            <div class="flex items-center gap-3">
                <!-- Language Switcher -->
                <div class="relative">
                    <button onclick="toggleLanguageMenu()" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                        <i class="fas fa-globe"></i>
                        <span class="uppercase">{{ lang }}</span>
                    </button>
                    <div id="language-menu" class="hidden absolute {{ 'left-0' if lang == 'ar' else 'right-0' }} mt-2 w-32 bg-white dark:bg-dark-card rounded-lg shadow-lg border dark:border-gray-700">
                        <a href="{{ url_for('set_language', lang='ar') }}" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 {{ 'text-primary font-bold' if lang == 'ar' else '' }}">
                            🇸🇦 العربية
                        </a>
                        <a href="{{ url_for('set_language', lang='en') }}" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 {{ 'text-primary font-bold' if lang == 'en' else '' }}">
                            🇬🇧 English
                        </a>
                    </div>
                </div>

                <!-- Dark Mode Toggle -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <i class="fas fa-moon dark:hidden text-gray-600"></i>
                    <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                </button>

                <!-- Mobile Menu -->
                <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="fas fa-bars text-gray-600 dark:text-gray-300"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden mt-4 pb-4 border-t dark:border-gray-700 pt-4">
            <a href="{{ url_for('index') }}" class="block py-2 text-gray-600 dark:text-gray-300">{{ _('Home') }}</a>
            <a href="#" onclick="toggleChat(); toggleMobileMenu();" class="block py-2 text-gray-600 dark:text-gray-300">{{ _('Chat') }}</a>
        </div>
    </div>
</header>
