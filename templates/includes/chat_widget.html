<!-- Chat Widget -->
<div class="chat-widget">
    <!-- Chat Button -->
    <button onclick="toggleChat()" class="w-14 h-14 bg-primary hover:bg-primary-dark text-white rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-110 animate-pulse-slow">
        <i class="fas fa-comments text-2xl"></i>
    </button>

    <!-- Chat Window -->
    <div id="chat-window" class="hidden chat-window bg-white dark:bg-dark-card flex flex-col overflow-hidden mt-4 {{ 'mr-0' if lang == 'ar' else 'ml-0' }}">
        <!-- Chat Header -->
        <div class="bg-primary text-white p-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fas fa-robot"></i>
                <span class="font-semibold">{{ _('Agricultural Assistant') }}</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="clearChat()" class="text-white/80 hover:text-white" title="{{ _('Clear chat') }}">
                    <i class="fas fa-trash-alt"></i>
                </button>
                <button onclick="toggleChat()" class="text-white/80 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- Chat Messages -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="flex gap-3">
                <div class="w-8 h-8 bg-primary rounded-full flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-robot text-white text-sm"></i>
                </div>
                <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-3 max-w-[80%]">
                    <p class="text-gray-700 dark:text-gray-300 text-sm">
                        {{ _('Hello! I am your agricultural assistant. Ask me about plant diseases, treatments, or farming tips.') }}
                    </p>
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="p-4 border-t dark:border-gray-700">
            <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2">
                <input 
                    type="text" 
                    id="chat-input" 
                    placeholder="{{ _('Ask me anything...') }}"
                    class="flex-1 px-4 py-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-primary"
                >
                <button type="submit" class="px-4 py-2 bg-primary hover:bg-primary-dark text-white rounded-lg transition">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</div>
